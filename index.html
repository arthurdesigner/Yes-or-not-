<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Um pedido especial ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
      position: relative;
      transition: all 0.3s ease;
    }

    .heart-icon {
      font-size: 50px;
      margin-bottom: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #ff4b72;
      font-size: 1.8rem;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }

    button, .btn-tiktok {
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-sim {
      background-color: #ff4b72;
      color: white;
      box-shadow: 0 8px 20px rgba(255, 75, 114, 0.35);
    }

    .btn-sim:hover {
      transform: scale(1.08);
      background-color: #e03a5f;
    }

    .btn-nao {
      background-color: #e0e0e0;
      color: #555;
      position: relative;
      z-index: 10;
    }

    /* Botão do TikTok na tela de sucesso */
    .btn-tiktok {
      background-color: #000000;
      color: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      margin-top: 20px;
    }

    .btn-tiktok:hover {
      transform: scale(1.08);
      background-color: #222222;
    }

    /* Mensagem Final escondida por padrão */
    .success-screen {
      display: none;
    }

    .success-screen h2 {
      color: #ff4b72;
      font-size: 1.9rem;
      margin-bottom: 15px;
    }

    .success-screen p {
      color: #444;
      font-size: 1.2rem;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 20px;
      }
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
  <!-- Biblioteca externa para soltar confetes -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="card" id="mainCard">
    <!-- TELA 1: Pergunta -->
    <div id="questionScreen">
      <div class="heart-icon">☕</div>
      <h1>Tafne, você poderia me passar seu Whatsapp?</h1>
      
      <div class="btn-container">
        <button class="btn-sim" id="btnSim">Sim! ✨</button>
        <button class="btn-nao" id="btnNao">Não</button>
      </div>
    </div>

    <!-- TELA 2: Sucesso (Mensagem pós-clique) -->
    <div class="success-screen" id="successScreen">
      <div class="heart-icon">🌹</div>
      <h2>Perfeito!</h2>
      <p>O Arthur que ama café vai ficar feliz viu!
        Tá quase lá, só clicar no botãozinho ali😉</p>
      <a href="https://www.tiktok.com/@arthurlovecoffee0" target="_blank" class="btn-tiktok">Abrir TikTok 🎬</a>
    </div>
  </div>

  <script>
    const btnNao = document.getElementById('btnNao');
    const btnSim = document.getElementById('btnSim');
    const questionScreen = document.getElementById('questionScreen');
    const successScreen = document.getElementById('successScreen');

    // Função para mover o botão Não
    function desviarBotao() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const btnWidth = btnNao.offsetWidth;
      const btnHeight = btnNao.offsetHeight;

      const randomX = Math.floor(Math.random() * (windowWidth - btnWidth - 40)) + 20;
      const randomY = Math.floor(Math.random() * (windowHeight - btnHeight - 40)) + 20;

      btnNao.style.position = 'fixed';
      btnNao.style.left = `${randomX}px`;
      btnNao.style.top = `${randomY}px`;
    }

    btnNao.addEventListener('mouseover', desviarBotao);
    btnNao.addEventListener('touchstart', (e) => {
      e.preventDefault();
      desviarBotao();
    });

    // Ação ao clicar no botão SIM
    btnSim.addEventListener('click', () => {
      questionScreen.style.display = 'none';
      successScreen.style.display = 'block';

      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
    });
  </script>
</body>
</html>
